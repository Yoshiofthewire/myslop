<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block head %}{% endblock %}
  <title>{% block title %}handoff{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header>
    <a href="/" class="brand">handoff</a>
    {% if user %}
      <nav>
        {% for path, key, label in [("/", "dashboard", "Dashboard"), ("/handoffs", "handoff", "Handoff"), ("/agents", "agents", "Agents")] %}
        <a href="{{ path }}" class="tab"{% if tab == key %} aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
        <form method="post" action="/logout" class="inline">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button type="submit">Log out {{ user.username }}</button>
        </form>
      </nav>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
